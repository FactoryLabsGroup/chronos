<!DOCTYPE html>
<html lang="en">
<head>
<base href="/chronos/open/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Run That Never Happened — Chronos</title>
<meta name="description" content="A card from Chronos, the strangest true stories in history as short illustrated cards.">
<!-- Safari shows the App Clip card for this page to anyone on iPhone without Chronos. -->
<meta name="apple-itunes-app" content="app-id=6813354610, app-clip-bundle-id=com.factorylabs.chronos.Clip, app-clip-display=card">
<meta name="theme-color" content="#F3ECDF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1220" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="article">
<meta property="og:site_name" content="Chronos">
<meta property="og:url" content="https://factorylabs.app/chronos/open/en/story/marathon-490/">
<meta property="og:title" content="Chronos">
<meta property="og:description" content="The marathon race is named after a heroic run that the earliest sources never mention">
<meta property="og:image" content="https://factorylabs.app/chronos/open/en/story/marathon-490/preview.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&family=Noto+Serif+Georgian:wght@600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
  /* Tokens mirror assets/styles.css, which mirrors ChronosColor in the iOS project. */
  :root {
    --bg: #F3ECDF; --surface: #FCF8F1; --surface-2: #EAE1D1;
    --ink: #1E1A16; --ink-2: #6E655B; --bronze: #8A5C22; --bronze-soft: #E8D3B4;
    --divider: #E1D7C5; --shadow: 59, 46, 30;
    --serif: ui-serif, "New York", "Source Serif 4", "Noto Serif Georgian", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Noto Sans Georgian", "Helvetica Neue", Arial, sans-serif;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1220; --surface: #171D2E; --surface-2: #202840;
      --ink: #F1E9DA; --ink-2: #B5AC9D; --bronze: #D2A462; --bronze-soft: #3A2F1E;
      --divider: #2A3350; --shadow: 0, 0, 0;
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font: 17px/1.6 var(--sans); -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; align-items: center;
    padding: max(24px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
  }
  main { width: 100%; max-width: 560px; }
  .brand { color: inherit; display: flex; align-items: center; gap: 10px; text-decoration: none; margin: 0 0 20px; font-weight: 700; letter-spacing: .02em; }
  .brand img { width: 32px; height: 32px; border-radius: 8px; }
  .card {
    background: var(--surface); border: 1px solid var(--divider); border-radius: 24px;
    padding: 24px; box-shadow: 0 18px 50px rgba(var(--shadow), .12);
  }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
  .pill { font-size: 13px; font-weight: 600; padding: 4px 11px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
  .pill--year { background: var(--bronze-soft); color: var(--bronze); }
  h1 { font: 700 clamp(26px, 6vw, 34px)/1.18 var(--serif); margin: 0 0 14px; letter-spacing: -0.01em; }
  .text p { margin: 0 0 12px; color: var(--ink-2); }
  .text p:first-child { color: var(--ink); font-weight: 500; }
  .sources { margin: 18px 0 0; padding: 16px 0 0; border-top: 1px solid var(--divider); font-size: 14px; color: var(--ink-2); }
  .sources h2 { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; margin: 0 0 6px; color: var(--bronze); }
  .sources ul { margin: 0; padding-left: 18px; }
  .cta { margin: 24px 0 0; text-align: center; }
  .cta p { margin: 0 0 14px; color: var(--ink-2); }
  .open {
    display: block; width: 100%; padding: 16px 20px; border-radius: 16px; border: 0;
    background: var(--bronze); color: #fff; font: 600 18px/1.2 var(--sans); text-decoration: none; margin: 0 0 12px;
  }
  @media (prefers-color-scheme: dark) { .open { color: #1A140C; } }
  .stores { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .store {
    display: inline-flex; align-items: center; gap: 12px; min-width: 196px;
    padding: 10px 22px 10px 16px; border-radius: 14px; background: #0B0B0F; color: #fff;
    text-decoration: none; border: 1px solid rgba(255,255,255,.28);
  }
  .store svg { width: 28px; height: 28px; flex: none; }
  .store span { display: flex; flex-direction: column; line-height: 1.1; text-align: left; }
  .store small { font-size: 12px; opacity: .85; }
  .store strong { font: 700 20px/1.15 var(--sans); }
  [hidden] { display: none !important; }
  @media (max-width: 480px) { .card { padding: 20px; } .stores { flex-direction: column; } .store { justify-content: center; } }
</style>
</head>
<body>
<main>
  <a class="brand" href="../"><img src="../assets/apple-touch-icon.png" alt="">Chronos</a>

  <article class="card" id="card" hidden>
    <div class="meta"><span class="pill pill--year" id="year"></span><span class="pill" id="category"></span><span class="pill" id="confidence"></span></div>
    <h1 id="title"></h1>
    <div class="text" id="text"></div>
    <div class="sources" id="sources"><h2 data-t="sources"></h2><ul id="sourceList"></ul></div>
  </article>

  <article class="card" id="missing" hidden>
    <h1 data-t="missingTitle"></h1>
    <div class="text"><p data-t="missingText"></p></div>
  </article>

  <div class="cta">
    <p data-t="more"></p>
    <a class="open" id="openClip" hidden data-t="open"></a>
    <div class="stores">
      <a class="store" id="appStore" href="https://apps.apple.com/app/id6813354610" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16.37 12.64c-.02-2.3 1.88-3.4 1.96-3.46-1.07-1.56-2.73-1.78-3.32-1.8-1.41-.14-2.76.83-3.47.83-.72 0-1.82-.81-3-.79-1.54.02-2.96.9-3.76 2.28-1.6 2.78-.41 6.9 1.15 9.15.76 1.1 1.67 2.34 2.86 2.3 1.15-.05 1.58-.74 2.97-.74 1.38 0 1.77.74 2.98.72 1.23-.02 2.01-1.12 2.76-2.23.87-1.28 1.23-2.52 1.25-2.58-.03-.01-2.4-.92-2.42-3.66zM14.1 5.9c.63-.77 1.06-1.83.94-2.9-.91.04-2.02.61-2.67 1.37-.58.67-1.1 1.76-.96 2.8 1.02.08 2.06-.52 2.69-1.27z"/></svg>
        <span><small data-t="appleSmall"></small><strong>App Store</strong></span>
      </a>
      <a class="store" id="playStore" href="https://play.google.com/store/apps/details?id=com.factorylabs.chronos" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#00D7FE" d="M3.6 2.3c-.3.3-.4.8-.4 1.3v16.8c0 .5.1 1 .4 1.3l.1.1 9.4-9.4v-.2L3.7 2.2z"/><path fill="#FFCE00" d="m16.2 15.5-3.1-3.1v-.2l3.1-3.1.1.1 3.7 2.1c1.1.6 1.1 1.6 0 2.2l-3.7 2.1z"/><path fill="#FF3A44" d="M16.3 15.4 13.1 12.3l-9.5 9.4c.4.4.9.4 1.6.1l11.1-6.4"/><path fill="#00F076" d="M16.3 9.2 5.2 2.8c-.7-.4-1.2-.3-1.6.1l9.5 9.4z"/></svg>
        <span><small data-t="googleSmall"></small><strong>Google Play</strong></span>
      </a>
    </div>
  </div>
</main>

<script>
(function () {
  // The link, exactly as the app writes it (see ChronosLink.swift): the card and its language
  // in the path, /open/ka/story/didgori-1121/, or, on links from 1.1, in the query.
  var params = new URLSearchParams(location.search);
  var slug = /^[a-z0-9-]{1,80}$/;
  var path = location.pathname.match(/\/open\/(ka|en)\/(story|fact)\/([a-z0-9-]{1,80})\/?$/);
  var story = path ? (path[2] === 'story' ? path[3] : '') : (params.get('story') || '').toLowerCase();
  var fact = path ? (path[2] === 'fact' ? path[3] : '') : (params.get('fact') || '').toLowerCase();
  story = slug.test(story) ? story : '';
  fact = slug.test(fact) ? fact : '';

  var lang = path ? path[1] : params.get('lang');
  if (lang !== 'ka' && lang !== 'en') {
    var prefs = navigator.languages || [navigator.language || 'en'];
    lang = prefs.some(function (l) { return /^ka\b/i.test(l); }) ? 'ka' : 'en';
  }
  document.documentElement.lang = lang;

  var strings = {
    en: {
      sources: 'Sources', open: 'Open in Chronos', more: 'More stories like this one, every day, in Chronos.',
      missingTitle: 'This card has moved on', missingText: 'It is no longer in Chronos, but there are plenty more strange true stories waiting.',
      appleSmall: 'Download on the', googleSmall: 'Get it on'
    },
    ka: {
      sources: 'წყაროები', open: 'გახსენი Chronos-ში', more: 'მსგავსი ამბები ყოველდღე, Chronos-ში.',
      missingTitle: 'ეს ბარათი აღარ არის', missingText: 'ის Chronos-ში აღარ არის, მაგრამ კიდევ ბევრი უცნაური ნამდვილი ამბავი გელოდება.',
      appleSmall: 'ჩამოტვირთე', googleSmall: 'ჩამოტვირთე'
    }
  }[lang];
  document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = strings[el.getAttribute('data-t')]; });

  // On an iPhone the App Clip can always be reached through Apple's own App Clip link, even
  // from in-app browsers that ignore the banner. With Chronos installed, the same link opens it.
  var android = /Android/i.test(navigator.userAgent);
  // iPadOS reports itself as a Mac; its touch screen gives it away.
  var ios = !android && (/iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1));
  if (ios) {
    var clip = new URLSearchParams();
    clip.set('p', 'com.factorylabs.chronos.Clip');
    if (story) clip.set('story', story); else if (fact) clip.set('fact', fact);
    clip.set('lang', lang);
    if (params.get('src')) clip.set('src', params.get('src'));
    var open = document.getElementById('openClip');
    open.href = 'https://appclip.apple.com/id?' + clip.toString();
    open.hidden = false;
    document.getElementById('playStore').hidden = true;
  } else if (android) {
    document.getElementById('appStore').hidden = true;
  }

  function show(id) { document.getElementById(id).hidden = false; }
  function set(id, value) { document.getElementById(id).textContent = value; }

  if (!story && !fact) { show('missing'); return; }

  fetch('../assets/content/' + lang + '.json')
    .then(function (response) { if (!response.ok) throw new Error(response.status); return response.json(); })
    .then(function (library) {
      // A story is the richer of the two, so it wins if a link somehow names both — as in the app.
      function find(table, id) { return id && Object.prototype.hasOwnProperty.call(table, id) ? table[id] : null; }
      var card = story ? find(library.stories, story) : find(library.facts, fact);
      if (!card) { show('missing'); return; }
      document.title = card.title + ' — Chronos';
      set('title', card.title);
      set('year', card.year);
      set('category', card.category);
      set('confidence', card.confidence);
      var text = document.getElementById('text');
      card.text.split('\n\n').forEach(function (paragraph) {
        var p = document.createElement('p'); p.textContent = paragraph; text.appendChild(p);
      });
      var list = document.getElementById('sourceList');
      card.sources.forEach(function (source) {
        var li = document.createElement('li'); li.textContent = source; list.appendChild(li);
      });
      if (!card.sources.length) document.getElementById('sources').hidden = true;
      show('card');
    })
    .catch(function () { show('missing'); });
})();
</script>
</body>
</html>
